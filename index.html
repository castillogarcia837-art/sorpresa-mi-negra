
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para mi negra</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="inicio">

        <!-- CORAZON -->
        <div class="corazon">♥</div>

        <!-- TITULO -->
        <p class="subtitulo">
            UNA HISTORIA, MUCHOS RECUERDOS
        </p>

        <h1>Para mi negra</h1>

        <!-- MENSAJE PRINCIPAL -->
        <p class="mensaje">
            Hay personas que llegan a nuestra vida
            y dejan recuerdos imposibles de olvidar.
        </p>

        <!-- BOTON DE LA CARTA -->
        <button id="abrirCarta">
            Tengo algo que decirte ♥
        </button>

        <!-- REPRODUCTOR MUSICAL -->
        <div class="reproductor">

            <audio id="musica" preload="auto" loop>
                <source
                    src="./audio/gymnopedie.ogg"
                    type="audio/ogg">
            </audio>

            <button id="controlMusica" type="button">
                ♫ Escuchar nuestra melodía
            </button>

        </div>

        <!-- FIRMA -->
        <p class="firma">
            Con cariño, alguien que aún te recuerda.
        </p>

    </main>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
